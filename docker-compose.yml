services:
  database:
    container_name: todo-db
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-newpassword}
      POSTGRES_DB: ${DB_NAME:-todoapp}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - todo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-todoapp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    image: todo-server
    container_name: todo-server
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: database
      DB_NAME: ${DB_NAME:-todoapp}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-newpassword}
      DB_PORT: 5432
    ports:
      - "9000:5000"
    networks:
      - todo-network
    depends_on:
      database:
        condition: service_healthy

  client:
    image: todo-client
    container_name: todo-client
    restart: unless-stopped
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - todo-network

networks:
  todo-network: 
    driver: bridge

volumes:
  db-data:
    driver: local