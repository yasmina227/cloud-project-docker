services:
  database:
    container_name: todo-db
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=newpassword
      - POSTGRES_DB=todoapp
    ports:
      - 5432:5432
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./server/config/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - todo-network

  server:
    image: todo-server
    container_name: todo-server
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: always
    env_file:
      - ./server/.env
    environment:
      - PORT=5000
      - DB_HOST=database
      - DB_NAME=todoapp
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=newpassword
      - DB_PORT=5432
    volumes:
      - ./server:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - 9000:9000
    networks:
      - todo-network
    depends_on:
      - database

  client:
    image: todo-client
    container_name: todo-client
    restart: unless-stopped
    env_file:
      - ./client/.env
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - 3000:3000
    volumes:
      - ./client:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - server
    networks:
      - todo-network

networks:
  todo-network: 
    driver: bridge

volumes:
  db-data:
    driver: local